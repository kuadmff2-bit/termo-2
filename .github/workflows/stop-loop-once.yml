name: Parar loop ao completar fileira

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-loop-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = """    if (/^[A-Z]$/.test(key)) {
      input[cursorPos] = key.toLowerCase();
      cursorPos = (cursorPos + 1) % 5;
      renderBoards();
    }
"""
          new = """    if (/^[A-Z]$/.test(key)) {
      if (input.every(Boolean)) return;
      input[cursorPos] = key.toLowerCase();
      if (input.every(Boolean)) {
        cursorPos = 4;
      } else {
        cursorPos = (cursorPos + 1) % 5;
      }
      renderBoards();
    }
"""
          if old not in s:
              raise SystemExit('Trecho nao encontrado')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Para loop ao completar fileira" || exit 0
          git pull --rebase origin main
          git push origin main
