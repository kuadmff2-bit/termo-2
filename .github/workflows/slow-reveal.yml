name: Ajustar revelacao lenta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/slow-reveal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace('await delay(440);', 'await delay(1120);')
          text = text.replace('tile.style.animationDelay = `${i * 45}ms`;', 'tile.style.animationDelay = `${i * 105}ms`;')
          app.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          text = text.replace('.tile.flip { animation: flip .42s ease both; }', '.tile.flip { animation: flip .70s cubic-bezier(.25,.8,.25,1) both; }')
          css.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('20260911-2300', '20260911-2301')
          text = text.replace('20260911-2256', '20260911-2301')
          index.write_text(text, encoding='utf-8')

      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html
          if git diff --cached --quiet; then
            echo "Nada para alterar"
            exit 0
          fi
          git commit -m "Deixa revelacao das letras mais lenta [skip ci]"
          git pull --rebase origin main
          git push origin main
