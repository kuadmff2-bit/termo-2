name: Sincronizar revelacao dos tabuleiros

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-reveal-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar animacao
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          old = '''  function animateSubmittedRow(rowIndex) {
    boardsEl.querySelectorAll(`.row[data-row="${rowIndex}"] .tile`).forEach((tile, i) => {
      tile.style.animationDelay = `${i * 105}ms`;
      tile.classList.add('flip');
    });
  }
'''

          new = '''  function animateSubmittedRow(rowIndex) {
    boardsEl.querySelectorAll('.board').forEach(board => {
      board.querySelectorAll(`.row[data-row="${rowIndex}"] .tile`).forEach((tile, col) => {
        tile.style.animationDelay = `${col * 145}ms`;
        tile.classList.add('flip');
      });
    });
  }
'''

          if old not in text:
              raise SystemExit('Trecho de animacao nao encontrado')

          app.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          import re
          stamp = '20260911-2322'
          html = re.sub(r'(app\.js\?v=)[0-9-]+', r'\g<1>' + stamp, html)
          index.write_text(html, encoding='utf-8')

      - name: Salvar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Sincroniza animacao entre tabuleiros" || exit 0
          git pull --rebase origin main
          git push origin main
