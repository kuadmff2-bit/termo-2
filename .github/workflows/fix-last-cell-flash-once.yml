name: Corrigir pisca da ultima casa

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-last-cell-flash-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar cursor no app
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          old = """    if (/^[A-Z]$/.test(key)) {
      input[cursorPos] = key.toLowerCase();
      cursorPos = (cursorPos + 1) % 5;
      renderBoards();
    }
"""
          new = """    if (/^[A-Z]$/.test(key)) {
      input[cursorPos] = key.toLowerCase();
      cursorPos = input.every(Boolean) ? 4 : (cursorPos + 1) % 5;
      renderBoards();
    }
"""
          if old not in text:
              raise SystemExit('Trecho esperado nao encontrado em app.js')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('app.js?v=20260911-2321', 'app.js?v=20260911-1950')
          index.write_text(html, encoding='utf-8')

      - name: Salvar mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Mantem cursor na ultima casa sem piscar"
          git pull --rebase origin main
          git push origin main
