name: Atualizar dicionário PT-BR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dictionary.yml'

permissions:
  contents: write

jobs:
  build-dictionary:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar ferramentas Hunspell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell-tools

      - name: Baixar dicionário oficial pt-BR do LibreOffice
        run: |
          curl -L --fail --retry 3 \
            -o pt_BR.aff \
            https://raw.githubusercontent.com/LibreOffice/dictionaries/master/pt_BR/pt_BR.aff
          curl -L --fail --retry 3 \
            -o pt_BR.dic \
            https://raw.githubusercontent.com/LibreOffice/dictionaries/master/pt_BR/pt_BR.dic

      - name: Expandir e filtrar flexões de 5 letras
        run: |
          # O Hunspell chega a produzir dezenas de milhões de formas. Filtramos
          # durante o próprio pipeline para não salvar/processar tudo depois.
          set +e
          unmunch pt_BR.dic pt_BR.aff 2>hunspell-warnings.log \
            | LC_ALL=C.UTF-8 grep -E '^[[:alpha:]]{5}$' \
            | sort -u > hunspell-5.txt
          set -e
          echo "Formas Hunspell de 5 letras: $(wc -l < hunspell-5.txt)"

      - name: Gerar lista ampla de palavras de 5 letras
        shell: python
        run: |
          import json
          import pathlib
          import re
          import unicodedata
          import urllib.request

          SOURCES = [
              'https://raw.githubusercontent.com/fserb/pt-br/master/lexico',
              'https://raw.githubusercontent.com/fserb/pt-br/master/conjuga%C3%A7%C3%B5es',
              'https://raw.githubusercontent.com/fserb/pt-br/master/icf',
              'https://raw.githubusercontent.com/pythonprobr/palavras/master/palavras.txt',
          ]

          TOKEN = re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿ]+", re.UNICODE)
          GUARANTEED = {'surfa', 'surfe', 'surfo'}

          def normalize(word: str) -> str:
              return ''.join(
                  ch for ch in unicodedata.normalize('NFD', word.lower())
                  if unicodedata.category(ch) != 'Mn'
              ).replace('ç', 'c')

          canonical = {}
          source_counts = {}

          def add_word(candidate: str):
              word = candidate.strip().lower()
              if not word:
                  return False
              key = normalize(word)
              if len(key) != 5 or not key.isascii() or not key.isalpha():
                  return False

              current = canonical.get(key)
              has_marks = word != key
              current_has_marks = current is not None and current != normalize(current)
              if current is None or (has_marks and not current_has_marks):
                  canonical[key] = word
                  return True
              return False

          for url in SOURCES:
              print(f'Baixando {url}')
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'termo-infinito-dictionary-builder'}
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  text = response.read().decode('utf-8', errors='ignore')

              before = len(canonical)
              for line in text.splitlines():
                  for candidate in TOKEN.findall(line):
                      add_word(candidate)
              source_counts[url] = len(canonical) - before

          before = len(canonical)
          dic_lines = pathlib.Path('pt_BR.dic').read_text(
              encoding='utf-8', errors='ignore'
          ).splitlines()
          for line in dic_lines[1:]:
              root = line.split('/', 1)[0].split('\t', 1)[0].strip()
              add_word(root)
          source_counts['LibreOffice pt_BR.dic (raízes)'] = len(canonical) - before

          before = len(canonical)
          expanded_path = pathlib.Path('hunspell-5.txt')
          if expanded_path.exists():
              with expanded_path.open('r', encoding='utf-8', errors='ignore') as handle:
                  for line in handle:
                      add_word(line)
          source_counts['LibreOffice + Hunspell (flexões)'] = len(canonical) - before

          before = len(canonical)
          for word in GUARANTEED:
              add_word(word)
          source_counts['garantidas'] = len(canonical) - before

          words = [canonical[key] for key in sorted(canonical)]

          if 'surfa' not in canonical:
              raise RuntimeError('Falha: SURFA não entrou no catálogo final')

          header = (
              '// GERADO AUTOMATICAMENTE. NÃO EDITE MANUALMENTE.\n'
              '// Fontes: fserb/pt-br, pythonprobr/palavras e LibreOffice pt-BR com flexões Hunspell.\n'
              f'// Total de formas únicas normalizadas com 5 letras: {len(words)}\n'
          )
          payload = (
              'window.TERMO_ALL_WORDS=' +
              json.dumps(words, ensure_ascii=False, separators=(',', ':')) +
              ';\n'
          )
          pathlib.Path('all-words.js').write_text(header + payload, encoding='utf-8')

          stats = {
              'total': len(words),
              'sources': source_counts,
              'checks': {'surfa': 'surfa' in canonical},
          }
          pathlib.Path('dictionary-stats.json').write_text(
              json.dumps(stats, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print(f'Total final: {len(words)} palavras de 5 letras')
          print('SURFA presente:', 'surfa' in canonical)

      - name: Salvar dicionário no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all-words.js dictionary-stats.json
          if git diff --cached --quiet; then
            echo "Dicionário já está atualizado."
            exit 0
          fi
          git commit -m "Amplia catálogo de palavras de 5 letras [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin main
