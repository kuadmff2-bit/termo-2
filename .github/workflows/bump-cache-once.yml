name: Forcar cache novo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-cache-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar versao dos arquivos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('20260911-2302','20260911-2307')
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/bump-cache-once.yml
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-cache-once.yml
          git commit -m "Força atualização do catálogo brasileiro [skip ci]"
          git pull --rebase origin main
          git push origin main
