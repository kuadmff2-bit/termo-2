<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101217" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Jogo de palavras infinito: Termo, Duplo, Triplo e Quarteto em sequência." />
  <title>TERMO ∞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260911-2240" />
  <style>
    .app-shell{grid-template-rows:68px auto 30px minmax(0,1fr) 38px auto}
    .cursor-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 4px}
    .cursor-nav button{width:54px;height:32px;border:1px solid #3a404c;border-radius:8px;background:#20242c;color:#f5f7fb;font-weight:800;font-size:18px;cursor:pointer}
    .cursor-nav button:hover{background:#2a303a;border-color:#667081}
    .cursor-nav span{font-size:10px;letter-spacing:.08em;color:#7f8898;font-weight:800}
    @media(max-width:760px){.app-shell{grid-template-rows:58px auto 26px minmax(0,1fr) 36px auto}.cursor-nav{margin-bottom:2px}.cursor-nav button{height:30px}}
  </style>
</head>
<body>
  <aside class="side-panel" id="sidePanel" aria-label="Progresso do ciclo">
    <div class="panel-brand">
      <span class="panel-mark">∞</span>
      <div><strong>TERMO</strong><small>INFINITO</small></div>
    </div>

    <div class="panel-label">JORNADA</div>
    <div class="mode-track">
      <div class="mode-item" data-mode="0"><span class="mode-dot">1</span><div><strong>TERMO</strong><small>6 tentativas</small></div></div>
      <div class="mode-item" data-mode="1"><span class="mode-dot">2</span><div><strong>DUPLO</strong><small>7 tentativas</small></div></div>
      <div class="mode-item" data-mode="2"><span class="mode-dot">3</span><div><strong>TRIPLO</strong><small>8 tentativas</small></div></div>
      <div class="mode-item" data-mode="3"><span class="mode-dot">4</span><div><strong>QUARTETO</strong><small>9 tentativas</small></div></div>
    </div>

    <div class="panel-divider"></div>
    <div class="panel-info"><span>TENTATIVA</span><strong id="attemptValue">1 / 6</strong></div>
    <div class="panel-info"><span>DESAFIO</span><strong id="boardValue">1 palavra</strong></div>
    <button class="side-next hidden" id="nextRoundBtn" type="button">Próxima rodada →</button>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="helpBtn" aria-label="Como jogar">?</button>
      <div class="brand-wrap">
        <h1 id="modeTitle">TERMO</h1>
        <div class="infinity">∞</div>
      </div>
      <button class="icon-btn" id="statsBtn" aria-label="Estatísticas">▥</button>
    </header>

    <section class="scorebar" aria-label="Progresso">
      <div><span class="label">PONTOS</span><strong id="scoreValue">0</strong></div>
      <div><span class="label">CICLO</span><strong id="cycleValue">1</strong></div>
      <div><span class="label">SEQUÊNCIA</span><strong id="streakValue">0</strong></div>
    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <section id="boards" class="boards boards-1" aria-label="Tabuleiros"></section>

    <div class="cursor-nav" aria-label="Mover entre as caixas">
      <button type="button" aria-label="Mover para a caixa anterior" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}))">←</button>
      <span>MOVER CAIXA</span>
      <button type="button" aria-label="Mover para a próxima caixa" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}))">→</button>
    </div>

    <section class="keyboard" id="keyboard" aria-label="Teclado virtual"></section>
  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="words.js?v=20260911-2240"></script>
  <script src="extra-words.js?v=20260911-2240"></script>
  <script src="all-words.js?v=20260911-2240"></script>
  <script src="dictionary-bridge.js?v=20260911-2240"></script>
  <script src="app.js?v=20260911-2240"></script>
</body>
</html>
