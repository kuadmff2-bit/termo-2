<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101217" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Jogo de palavras infinito: Termo, Duplo, Triplo e Quarteto em sequência." />
  <title>TERMU ∞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260911-2318" />
  <style>
    .app-shell{
      width:min(100%,1060px);
      grid-template-rows:48px 24px minmax(0,1fr) auto;
    }

    .topbar{
      height:48px;
      position:relative;
      display:block;
    }
    .corner-brand{
      position:fixed;
      z-index:25;
      left:10px;
      top:10px;
      font-size:28px;
      line-height:1;
      font-weight:800;
      letter-spacing:.11em;
      color:#f5f7fb;
      user-select:none;
    }
    .brand-wrap{
      position:fixed;
      z-index:24;
      left:50%;
      top:9px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      white-space:nowrap;
      pointer-events:none;
    }
    .brand-wrap h1{font-size:clamp(21px,3vw,29px);margin:0}
    .infinity{font-size:23px}
    #statsBtn{display:none!important}

    /* Placar lateral menor para liberar mais espaço para os tabuleiros. */
    .side-panel.stats-panel{
      display:block;
      position:fixed;
      z-index:20;
      left:max(18px,calc(50vw - 760px));
      top:50%;
      transform:translateY(-50%);
      width:165px;
      padding:7px;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(23,26,33,.94);
      box-shadow:0 16px 38px rgba(0,0,0,.24);
      backdrop-filter:blur(14px);
    }
    .stats-panel .scorebar{
      width:100%;
      margin:0;
      grid-template-columns:1fr;
      border-radius:9px;
      box-shadow:none;
      background:transparent;
    }
    .stats-panel .scorebar>div{
      padding:10px 6px;
      border-right:0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .stats-panel .scorebar>div:last-child{border-bottom:0}
    .stats-panel .scorebar .label{font-size:8px;margin-bottom:3px}
    .stats-panel .scorebar strong{font-size:18px}

    .boards{column-gap:42px;row-gap:24px}
    .boards-2{column-gap:68px}
    .boards-3{column-gap:38px}

    /* QUARTETO precisa caber inteiro junto com o teclado. */
    .boards-4{
      grid-template-columns:repeat(2,145px);
      column-gap:74px;
      row-gap:18px;
      align-content:center;
      padding:5px 0 7px;
    }
    .boards-4 .board{gap:3px}
    .boards-4 .row{gap:3px}
    .boards-4 .tile{
      border-width:2px;
      border-radius:4px;
      font-size:clamp(14px,2.2vmin,19px);
    }

    @media(max-width:1200px){
      .app-shell{
        width:min(100%,960px);
        grid-template-rows:48px auto 24px minmax(0,1fr) auto;
      }
      .side-panel.stats-panel{
        display:block;
        position:static;
        transform:none;
        width:min(100%,500px);
        margin:4px auto 0;
        padding:0;
        border:0;
        background:transparent;
        box-shadow:none;
        backdrop-filter:none;
      }
      .stats-panel .scorebar{grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.035)}
      .stats-panel .scorebar>div{padding:5px 7px;border-bottom:0;border-right:1px solid rgba(255,255,255,.08)}
      .stats-panel .scorebar>div:last-child{border-right:0}
      .stats-panel .scorebar .label{margin-bottom:1px}
      .stats-panel .scorebar strong{font-size:13px}
      .boards-2{column-gap:46px}
      .boards-3{column-gap:24px}
      .boards-4{grid-template-columns:repeat(2,138px);column-gap:42px;row-gap:16px}
    }

    @media(max-width:760px){
      .app-shell{
        width:100%;
        grid-template-rows:44px auto 22px auto auto;
      }
      .topbar{height:44px}
      .corner-brand{
        left:7px;
        top:12px;
        font-size:20px;
        letter-spacing:.08em;
      }
      .brand-wrap{top:11px}
      .brand-wrap h1{font-size:20px}
      .infinity{font-size:19px}
      .boards{column-gap:12px;row-gap:14px}
      .boards-2{column-gap:14px}
      .boards-3{column-gap:7px}
      .boards-4{grid-template-columns:repeat(2,124px);column-gap:13px;row-gap:12px}
      .boards-4 .board{gap:2px}
      .boards-4 .row{gap:2px}
      .boards-4 .tile{border-width:2px;font-size:14px}
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="corner-brand" aria-label="TERMU">TERMU</div>
      <div class="brand-wrap">
        <h1 id="modeTitle">TERMO</h1>
        <div class="infinity">∞</div>
      </div>
      <button class="icon-btn" id="statsBtn" aria-label="Estatísticas">▥</button>
    </header>

    <aside class="side-panel stats-panel" id="sidePanel" aria-label="Placar">
      <section class="scorebar" aria-label="Progresso">
        <div><span class="label">PONTOS</span><strong id="scoreValue">0</strong></div>
        <div><span class="label">CICLO</span><strong id="cycleValue">1</strong></div>
        <div><span class="label">SEQUÊNCIA</span><strong id="streakValue">0</strong></div>
      </section>

      <div class="hidden" aria-hidden="true">
        <button class="icon-btn" id="helpBtn" type="button" tabindex="-1">?</button>
        <span id="attemptValue">1 / 6</span>
        <span id="boardValue">1 palavra</span>
        <button id="nextRoundBtn" type="button">Próxima rodada →</button>
      </div>
    </aside>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <section id="boards" class="boards boards-1" aria-label="Tabuleiros"></section>
    <section class="keyboard" id="keyboard" aria-label="Teclado virtual"></section>
  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="words.js?v=20260911-2318"></script>
  <script src="extra-words.js?v=20260911-2318"></script>
  <script src="all-words.js?v=20260911-2318"></script>
  <script src="common-br.js?v=20260911-2318"></script>
  <script src="dictionary-bridge.js?v=20260911-2318"></script>
  <script src="guess-bridge.js?v=20260911-2318"></script>
  <script src="app.js?v=20260911-2318"></script>
  <script src="ui-enhancements.js?v=20260911-2318"></script>
</body>
</html>
