<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6e5c62" />
  <meta name="description" content="Jogo de palavras infinito: Termo, Duplo, Triplo e Quarteto em sequência." />
  <title>TERMO ∞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="helpBtn" aria-label="Como jogar">?</button>
      <div class="brand-wrap">
        <h1 id="modeTitle">TERMO</h1>
        <div class="infinity">∞</div>
      </div>
      <button class="icon-btn" id="statsBtn" aria-label="Estatísticas">▥</button>
    </header>

    <section class="scorebar" aria-label="Progresso">
      <div><span class="label">PONTOS</span><strong id="scoreValue">0</strong></div>
      <div><span class="label">CICLO</span><strong id="cycleValue">1</strong></div>
      <div><span class="label">SEQUÊNCIA</span><strong id="streakValue">0</strong></div>
    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <section id="boards" class="boards boards-1" aria-label="Tabuleiros"></section>

    <section class="keyboard" id="keyboard" aria-label="Teclado virtual"></section>
  </main>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="words.js"></script>
  <script src="all-words.js"></script>
  <script src="dictionary-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
